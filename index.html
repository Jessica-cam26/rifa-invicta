<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifary - Sorteo Invicta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <div class="user-profile">
                <div class="avatar-wrapper">
                    <img src="avatar.png" alt="Avatar" class="avatar-img">
                </div>
                <div class="user-info">
                    <h2>BRANDON DELGADO</h2>
                    <span>17 DE JUNIO DE 2026</span>
                </div>
            </div>
            
            <div class="progress-section">
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar" style="width: 0%;"></div>
                </div>
                <span id="progressText" class="progress-percentage">0%</span>
                <div class="header-icons">
                    <div class="icon-btn ticket-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2.5a2.5 2.5 0 0 1 0 5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4.5a2.5 2.5 0 0 1 0-5zM8.5 6h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1zm1 12H7v-2h2.5v2zm0-3.5H7v-2h2.5v2zm0-3.5H7V9h2.5v2z"/></svg>
                    </div>
                    <div class="icon-btn menu-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-layout">
            
            <aside class="left-panel">
                <div class="brand-header-box">
                    <div class="watch-badge">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 2c-3.87 0-7 3.13-7 7 0 3.47 2.52 6.34 5.83 6.89V22h2.34v-6.11c3.31-.55 5.83-3.42 5.83-6.89 0-3.87-3.13-7-7-7zm1 8h-3V8h3v2z"/></svg>
                    </div>
                    <div class="brand-text">
                        <h3>RIFA DE UN RELOJ PREMIUM INVICTA</h3>
                        <p class="warranty-label">CON GARANTÍA DE 3 AÑOS</p>
                    </div>
                </div>

                <div class="gallery">
                    <div class="photo-card">
                        <div class="img-wrapper">
                            <img src="reloj.jpg" alt="Reloj">
                        </div>
                        <p class="photo-caption">RELOJ INVICTA EN CAJA DE SEGURIDAD</p>
                    </div>
                    <div class="photo-card">
                        <div class="img-wrapper">
                            <img src="caja.jpg" alt="Caja">
                        </div>
                        <p class="photo-caption">CAJA DE SEGURIDAD INVICTA</p>
                    </div>
                </div>
            </aside>

            <section class="right-panel">
                <div class="panel-title-bar">
                    <h2>¡ESCOGE TUS NÚMEROS!</h2>
                    <div class="indicator">
                        <span class="dot"></span> Disponibles
                    </div>
                </div>

                <main id="gridTablero" class="numbers-grid"></main>

                <div class="registration-drawer">
                    <div class="drawer-inputs">
                        <input type="text" id="selectedNumDisplay" readonly value="--">
                        <input type="text" id="buyerNameInput" placeholder="Ingresa el nombre del comprador..." disabled>
                    </div>
                </div>
            </section>

        </div>

        <footer class="app-footer">
            <div class="price-box">
                VALOR DEL NÚMERO: <span>$10.000</span>
            </div>
            <div class="footer-actions">
                <button onclick="reiniciarRifa()" class="btn-clear-data">Limpiar Datos</button>
                <button onclick="confirmarBoleto()" id="btnSubmit" class="btn-confirm" disabled>Confirmar Selección</button>
            </div>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
<footer class="app-footer">
            <div class="price-box">
                VALOR DEL NÚMERO: <span>$10.000</span>
            </div>
            <div class="footer-actions">
                <button onclick="reiniciarRifa()" class="btn-clear-data">Limpiar Datos</button>
                <button onclick="enviarWhatsApp()" id="btnWhatsApp" class="btn-confirm" style="background-color: #25d366; color: white;" disabled>Compartir WhatsApp</button>
                <button onclick="confirmarBoleto()" id="btnSubmit" class="btn-confirm" disabled>Confirmar Selección</button>
            </div>
        </footer>
